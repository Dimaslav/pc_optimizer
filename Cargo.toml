[package]
name = "rust-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
# --- Оконная система ---
winit = "0.30"

# --- Графика (последняя 25.x) ---
wgpu = "25"

# --- Асинхронный запуск ---
pollster = "0.4"

# --- Сериализация / математика / утилиты ---
bytemuck = { version = "1.21", features = ["derive"] }
glam = { version = "0.30", features = ["bytemuck", "serde"] }
log = "0.4"
env_logger = "0.11"

# --- Картинки / HDR / EXR ---
image = { version = "0.25", default-features = false, features = [
    "png", "jpeg", "gif", "webp", "bmp", "tiff", "tga", "dds",
    "hdr", "exr", "ico", "pnm", "qoi", "ff"
] }

# --- zlib для FBX binary ---
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

# --- Ошибки / glTF / serde / ron ---
anyhow = "1"
gltf = { version = "1.4", default-features = false, features = ["import", "utils", "names"] }
serde = { version = "1", features = ["derive"] }
ron = "0.8"

# --- UI (0.32, совместима с wgpu 25) ---
egui = "0.32"
egui-wgpu = "0.32"
egui-winit = "0.32"

# --- Аудио (дефолтные фичи, чтобы был cpal) ---
rodio = "0.21"

# --- Нативный диалог выбора файлов ---
rfd = "0.14"